<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blackjack — Casino Royale</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --felt1: #0b6b3a;
    --felt2: #064d28;
    --gold: #e8c766;
    --gold-dim: #b9933f;
    --card-red: #c0392b;
    --card-black: #1c1c1c;
  }

  html, body { height: 100%; }

  body {
    font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #f3f3f3;
    background:
      radial-gradient(ellipse at 50% 15%, var(--felt1) 0%, var(--felt2) 60%, #03361c 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
    user-select: none;
  }

  header {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 26px;
    background: linear-gradient(180deg, rgba(0,0,0,0.35), rgba(0,0,0,0));
    gap: 14px;
    flex-wrap: wrap;
  }

  .brand {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 1.7rem;
    letter-spacing: 1px;
    color: var(--gold);
    text-shadow: 0 2px 6px rgba(0,0,0,0.5);
  }
  .brand small { display:block; font-size:.62rem; letter-spacing:3px; color:#cbb36a; opacity:.8; }

  .header-right { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }

  .wallet {
    display: flex;
    gap: 18px;
    align-items: center;
    font-weight: 600;
  }
  .wallet .pill {
    background: rgba(0,0,0,0.3);
    border: 1px solid var(--gold-dim);
    border-radius: 999px;
    padding: 8px 16px;
    min-width: 120px;
    text-align: center;
  }
  .wallet .label { font-size:.62rem; letter-spacing:2px; color:#cbb36a; display:block; text-transform:uppercase; }
  .wallet .value { font-size:1.15rem; color:#fff; }
  #balance.flash { animation: flash .6s ease; }
  @keyframes flash { 0%,100%{color:#fff;} 50%{color:var(--gold); transform:scale(1.12);} }

  .top-btn {
    font-family: inherit; cursor: pointer;
    background: rgba(0,0,0,0.3); color: var(--gold);
    border: 1px solid var(--gold-dim); border-radius: 999px;
    padding: 9px 14px; font-weight: 700; font-size: .88rem;
    transition: background .2s, transform .1s, opacity .22s;
  }
  .top-btn:hover { background: rgba(232,199,102,0.18); }
  .top-btn:active { transform: scale(.95); }

  .lang-switch {
    display: inline-flex; background: rgba(0,0,0,0.3);
    border: 1px solid var(--gold-dim); border-radius: 999px; overflow: hidden;
  }
  .lang-switch button {
    font-family: inherit; border: none; background: transparent; color: #cbb36a;
    padding: 8px 13px; cursor: pointer; font-weight: 700; font-size: .85rem;
    transition: background .2s, color .2s;
  }
  .lang-switch button.active { background: var(--gold); color: #1c1c1c; }
  .lang-switch button:not(.active):hover { background: rgba(232,199,102,0.15); color: var(--gold); }

  /* ---------- Card-Counting HUD ---------- */
  .hud {
    position: fixed; top: 96px; left: 16px; z-index: 30;
    background: rgba(6,24,16,0.82);
    border: 1px solid rgba(232,199,102,0.5);
    border-radius: 14px; padding: 12px 16px; min-width: 164px;
    box-shadow: 0 0 20px rgba(232,199,102,0.22), inset 0 0 20px rgba(0,0,0,0.45);
    backdrop-filter: blur(6px);
    font-size: .82rem;
    animation: hudGlow 3.2s ease-in-out infinite;
  }
  @keyframes hudGlow {
    0%,100% { box-shadow: 0 0 16px rgba(232,199,102,0.18), inset 0 0 18px rgba(0,0,0,0.45); }
    50%     { box-shadow: 0 0 28px rgba(232,199,102,0.40), inset 0 0 18px rgba(0,0,0,0.45); }
  }
  .hud h4 { font-size:.6rem; letter-spacing:3px; color:var(--gold); text-align:center; margin-bottom:10px; text-transform:uppercase; }
  .hud .row { display:flex; justify-content:space-between; gap:14px; margin:5px 0; align-items:center; }
  .hud .row > span:first-child { color:#9db5a6; font-size:.74rem; }
  .hud .val { font-weight:800; font-variant-numeric: tabular-nums; font-size:1rem; }
  .hud .val.pos { color:#7CFC98; text-shadow:0 0 10px rgba(124,252,152,.7); }
  .hud .val.neg { color:#ff8a7a; text-shadow:0 0 10px rgba(255,138,122,.7); }
  .hud .val.zero { color:#ffe27a; text-shadow:0 0 8px rgba(255,226,122,.5); }
  .hud .edge { margin-top:10px; text-align:center; font-size:.72rem; font-weight:700; padding:5px; border-radius:7px; background:rgba(0,0,0,.3); }
  .hud .edge.hi { color:#7CFC98; } .hud .edge.lo { color:#ff8a7a; } .hud .edge.mid { color:#cbb36a; }
  @media (max-width: 880px) { .hud { transform: scale(.82); transform-origin: top left; } }

  /* ---------- Canvas FX ---------- */
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 45; }

  .table {
    position: relative;
    width: min(960px, 96vw);
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 10px 0 20px;
  }

  .felt-ring {
    position:absolute; inset: 6px 10px auto 10px; height: 64%;
    border: 2px solid rgba(232,199,102,0.25);
    border-radius: 48% 48% 46% 46% / 70% 70% 40% 40%;
    pointer-events:none;
  }

  .area { text-align: center; padding: 6px 0; position: relative; z-index:2; }
  .area .tag {
    font-size: .7rem; letter-spacing: 3px; text-transform: uppercase;
    color: #cbb36a; margin-bottom: 6px;
  }

  .hands-row { display:flex; gap: 22px; justify-content:center; flex-wrap:wrap; }

  .hand {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    padding: 10px 14px 8px;
    border-radius: 14px;
    transition: background .25s, box-shadow .25s;
  }
  .hand.active { background: rgba(232,199,102,0.10); box-shadow: 0 0 0 2px rgba(232,199,102,0.45) inset; }

  .cards { display:flex; min-height: 132px; align-items:center; }
  .cards .card:not(:first-child) { margin-left: -42px; }

  .card {
    width: 92px; height: 128px;
    border-radius: 10px;
    background: #fdfdfd;
    color: var(--card-black);
    box-shadow: 0 6px 14px rgba(0,0,0,0.4);
    position: relative;
    display:flex; align-items:center; justify-content:center;
    font-weight: 700;
    animation: dealIn .4s cubic-bezier(.2,.9,.3,1.3) both;
    border: 1px solid #ddd;
  }
  .card.red { color: var(--card-red); }
  .card .corner {
    position:absolute; font-size: .95rem; line-height:1; text-align:center;
  }
  .card .corner.tl { top:7px; left:8px; }
  .card .corner.br { bottom:7px; right:8px; transform: rotate(180deg); }
  .card .pip { font-size: 2.4rem; }
  .card .corner .r { display:block; font-size:.95rem; font-weight:800; }
  .card .corner .s { display:block; font-size:.9rem; margin-top:-2px; }

  .card.back {
    background:
      repeating-linear-gradient(45deg, #7a1f2b 0 8px, #8f2733 8px 16px);
    border: 3px solid #fff;
  }
  .card.back::after {
    content:""; position:absolute; inset:8px; border:2px solid rgba(255,255,255,.5); border-radius:6px;
  }

  @keyframes dealIn {
    from { transform: translate(230px,-320px) rotate(22deg); opacity:0; }
    to   { transform: none; opacity:1; }
  }

  .score-badge {
    margin-top: 8px;
    background: rgba(0,0,0,0.45);
    border: 1px solid var(--gold-dim);
    border-radius: 999px;
    padding: 2px 12px; font-size:.85rem; min-width: 44px;
  }
  .hand .bet-tag { font-size:.72rem; color:var(--gold); margin-top:4px; }
  .hand .result-tag { font-size:.8rem; font-weight:700; margin-top:4px; min-height:1em; }
  .result-tag.win { color:#7CFC98; } .result-tag.lose { color:#ff8a7a; } .result-tag.push{ color:#ffe27a; }

  .message {
    text-align:center; min-height: 28px; font-size: 1.05rem; color: var(--gold);
    text-shadow: 0 1px 4px rgba(0,0,0,.5); padding: 4px; z-index:2; position:relative;
  }

  .controls { z-index:3; position:relative; padding-bottom: 6px; }

  .chips { display:flex; gap:14px; justify-content:center; margin-bottom:14px; flex-wrap:wrap; }
  .chip {
    width: 62px; height: 62px; border-radius: 50%;
    border: 4px dashed rgba(255,255,255,0.8);
    display:flex; align-items:center; justify-content:center;
    font-weight: 800; font-size: .95rem; cursor:pointer;
    box-shadow: 0 5px 10px rgba(0,0,0,.4);
    transition: transform .12s, filter .12s;
    position: relative;
  }
  .chip:hover { transform: translateY(-4px) scale(1.05); filter: brightness(1.1); }
  .chip:active { transform: translateY(0) scale(.97); }
  .chip[disabled] { opacity:.35; pointer-events:none; filter:grayscale(.6); }
  .chip.c5   { background: radial-gradient(circle at 50% 40%, #e74c3c, #a82315); }
  .chip.c25  { background: radial-gradient(circle at 50% 40%, #2ecc71, #157a3f); }
  .chip.c100 { background: radial-gradient(circle at 50% 40%, #34495e, #1b2733); }
  .chip.c500 { background: radial-gradient(circle at 50% 40%, #9b59b6, #5e2d73); }

  .btn-row { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
  button.action {
    font-family: inherit; font-weight:700; letter-spacing:.5px;
    padding: 12px 20px; border-radius: 10px; border: none; cursor:pointer;
    color:#1c1c1c; font-size:.95rem;
    background: linear-gradient(180deg, #f4d87c, var(--gold-dim));
    box-shadow: 0 4px 0 #8a6f2c, 0 6px 12px rgba(0,0,0,.35);
    transition: transform .08s, box-shadow .08s, filter .12s;
    text-transform: uppercase;
  }
  button.action:hover { filter:brightness(1.06); }
  button.action:active { transform: translateY(3px); box-shadow: 0 1px 0 #8a6f2c, 0 3px 6px rgba(0,0,0,.35); }
  button.action.secondary {
    background: linear-gradient(180deg,#4a6a55,#2f4a3a); color:#f3f3f3; box-shadow:0 4px 0 #1d3225, 0 6px 12px rgba(0,0,0,.35);
  }
  button.action.secondary:active { box-shadow:0 1px 0 #1d3225; }
  button.action.hint {
    background: linear-gradient(180deg,#6aa0e8,#3a63a8); color:#fff; box-shadow:0 4px 0 #244270,0 6px 12px rgba(0,0,0,.35);
  }
  button.action.hint:active { box-shadow:0 1px 0 #244270; }
  button.action[disabled] { opacity:.4; pointer-events:none; filter:grayscale(.4); }

  .bet-display { text-align:center; margin-bottom:12px; font-size:1rem; }
  .bet-display b { color:var(--gold); font-size:1.3rem; }

  .footer-links { font-size:.72rem; color:#9db5a6; padding: 6px; display:flex; gap:16px; align-items:center; flex-wrap:wrap; justify-content:center; }
  .footer-links a, .footer-links span.lk { color:#cbb36a; cursor:pointer; text-decoration:underline; }
  .sound-toggle { cursor:pointer; }

  .toast {
    position: fixed; top: 76px; left:50%; transform: translateX(-50%) translateY(-20px);
    background: rgba(10,30,20,0.95); border:1px solid var(--gold);
    color:#fff; padding: 12px 22px; border-radius: 10px; font-size:.95rem;
    opacity:0; pointer-events:none; transition: all .3s; z-index: 60; max-width: 90vw; text-align:center;
    box-shadow: 0 8px 24px rgba(0,0,0,.5);
  }
  .toast.show { opacity:1; transform: translateX(-50%) translateY(0); }
  .toast b { color: var(--gold); }

  /* ---------- Instructions modal ---------- */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.65); backdrop-filter: blur(4px);
    z-index: 100; display: flex; align-items: center; justify-content: center; padding: 20px;
    opacity: 0; transition: opacity .25s;
  }
  .modal-overlay.show { opacity: 1; }
  .modal-overlay.hidden { display: none; }
  .modal-card {
    background: linear-gradient(160deg,#0c3b24,#06301c);
    border: 1px solid var(--gold-dim); border-radius: 16px;
    max-width: 640px; width: 100%; max-height: 85vh; overflow-y: auto;
    padding: 28px 30px; position: relative;
    box-shadow: 0 20px 60px rgba(0,0,0,.6), 0 0 32px rgba(232,199,102,.16);
    transform: translateY(12px) scale(.98); transition: transform .25s;
  }
  .modal-overlay.show .modal-card { transform: none; }
  .modal-card h2 { color: var(--gold); font-family: Georgia, serif; margin-bottom: 10px; font-size: 1.5rem; }
  .modal-card h3 { color: var(--gold); margin: 16px 0 6px; font-size: 1.05rem; }
  .modal-card p { line-height: 1.6; margin-bottom: 8px; color: #e6efe9; font-size: .92rem; }
  .modal-card ul { margin: 4px 0 8px; padding-inline-start: 22px; }
  .modal-card li { line-height: 1.55; margin-bottom: 5px; color: #e6efe9; font-size: .92rem; }
  .modal-card b { color: var(--gold); }
  .modal-close {
    position: absolute; top: 10px; inset-inline-end: 14px;
    background: none; border: none; color: #cbb36a; font-size: 1.9rem; cursor: pointer; line-height: 1;
  }
  .modal-close:hover { color: var(--gold); }

  .hidden { display:none !important; }

  /* Smooth language-switch fade */
  header, .message, .controls, .footer-links, .area .tag, .hud {
    transition: opacity .22s ease;
  }
  body.lang-fade header,
  body.lang-fade .message,
  body.lang-fade .controls,
  body.lang-fade .footer-links,
  body.lang-fade .area .tag,
  body.lang-fade .hud { opacity: 0; }

  @media (max-width: 560px) {
    .card { width: 72px; height: 100px; }
    .cards .card:not(:first-child){ margin-left:-34px; }
    .cards { min-height: 104px; }
    .brand { font-size:1.3rem; }
  }
</style>
</head>
<body>
  <canvas id="fx"></canvas>

  <header>
    <div class="brand">♠ Casino Royale ♥<small data-i18n="brandSub">BLACKJACK · PAYS 3 TO 2</small></div>
    <div class="header-right">
      <div class="wallet">
        <div class="pill"><span class="label" data-i18n="balanceLabel">Balance</span><span class="value">$<span id="balance">1000</span></span></div>
        <div class="pill"><span class="label" data-i18n="betLabel">Bet</span><span class="value">$<span id="betAmount">0</span></span></div>
      </div>
      <button class="top-btn" id="howTo" data-i18n="howToPlay">📖 How to Play</button>
      <div class="lang-switch" id="langSwitch">
        <button data-lang="en">EN</button>
        <button data-lang="he">עב</button>
        <button data-lang="ar">ع</button>
      </div>
    </div>
  </header>

  <div class="hud" id="hud">
    <h4 data-i18n="hudTitle">Card Counting</h4>
    <div class="row"><span data-i18n="hudRunning">Running Count</span><span class="val" id="rcVal">0</span></div>
    <div class="row"><span data-i18n="hudTrue">True Count</span><span class="val" id="tcVal">0.0</span></div>
    <div class="row"><span data-i18n="hudDecks">Decks Left</span><span class="val zero" id="decksVal">6.0</span></div>
    <div class="edge mid" id="edgeVal">Even odds</div>
  </div>

  <div class="table">
    <div class="felt-ring"></div>

    <div class="area" id="dealerArea">
      <div class="tag" data-i18n="dealer">Dealer</div>
      <div class="hands-row">
        <div class="hand">
          <div class="cards" id="dealerCards"></div>
          <div class="score-badge" id="dealerScore">—</div>
        </div>
      </div>
    </div>

    <div class="message" id="message">Place your bet to begin.</div>

    <div class="area" id="playerArea">
      <div class="hands-row" id="playerHands"></div>
      <div class="tag" style="margin-top:6px" data-i18n="player">Player</div>
    </div>

    <div class="controls">
      <!-- Betting phase -->
      <div id="bettingControls">
        <div class="bet-display"><span data-i18n="currentWager">Current wager:</span> <b>$<span id="betDisplay">0</span></b></div>
        <div class="chips">
          <div class="chip c5"   data-val="5">$5</div>
          <div class="chip c25"  data-val="25">$25</div>
          <div class="chip c100" data-val="100">$100</div>
          <div class="chip c500" data-val="500">$500</div>
        </div>
        <div class="btn-row">
          <button class="action secondary" id="clearBet" data-i18n="clear">Clear</button>
          <button class="action secondary" id="maxBet" data-i18n="max">Max</button>
          <button class="action" id="dealBtn" data-i18n="deal">Deal</button>
        </div>
      </div>

      <!-- Play phase -->
      <div id="playControls" class="hidden">
        <div class="btn-row">
          <button class="action" id="hitBtn" data-i18n="hit">Hit</button>
          <button class="action" id="standBtn" data-i18n="stand">Stand</button>
          <button class="action secondary" id="doubleBtn" data-i18n="double">Double</button>
          <button class="action secondary" id="splitBtn" data-i18n="split">Split</button>
          <button class="action hint" id="hintBtn" data-i18n="hint">💡 Hint</button>
        </div>
      </div>

      <!-- Round over -->
      <div id="overControls" class="hidden">
        <div class="btn-row">
          <button class="action" id="nextBtn" data-i18n="newHand">New Hand</button>
        </div>
      </div>
    </div>

    <div class="footer-links">
      <span class="sound-toggle lk" id="soundToggle">🔊 Sound: On</span>
      <span class="lk" id="resetBank" data-i18n="resetBank">Reset bankroll</span>
      <span id="rulesText" data-i18n="rules">Dealer stands on 17 · 6-deck shoe</span>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- Instructions modal -->
  <div class="modal-overlay hidden" id="modal">
    <div class="modal-card">
      <button class="modal-close" id="modalClose" aria-label="Close">&times;</button>
      <div id="modalBody"></div>
    </div>
  </div>

<script>
(() => {
  "use strict";

  // ---------- Internationalization (i18n) ----------
  const T = {
    en: {
      brandSub: 'BLACKJACK · PAYS 3 TO 2',
      balanceLabel: 'Balance', betLabel: 'Bet',
      dealer: 'Dealer', player: 'Player',
      currentWager: 'Current wager:',
      clear: 'Clear', max: 'Max', deal: 'Deal',
      hit: 'Hit', stand: 'Stand', double: 'Double', split: 'Split',
      hint: '💡 Hint', newHand: 'New Hand',
      resetBank: 'Reset bankroll',
      rules: 'Dealer stands on 17 · 6-deck shoe',
      soundOn: '🔊 Sound: On', soundOff: '🔇 Sound: Off',
      howToPlay: '📖 How to Play',
      // HUD
      hudTitle: 'Card Counting', hudRunning: 'Running Count', hudTrue: 'True Count', hudDecks: 'Decks Left',
      edgeHigh: 'Player advantage ▲', edgeNeutral: 'Even odds', edgeLow: 'House favored ▼',
      // messages
      placeBet: 'Place your bet to begin.',
      dealing: 'Dealing…',
      yourMove: 'Your move. Hit, Stand, Double or Split?',
      bustOn: (t) => `Bust on ${t}!`,
      youHave: (t) => `You have ${t}.`,
      doubledBust: (t) => `Doubled and busted on ${t}!`,
      doubledStand: (t) => `Doubled — standing on ${t}.`,
      splitAces: 'Split aces — one card each.',
      playingHand: (i) => `Playing hand ${i}.`,
      playingHandOf: (i, n) => `Playing hand ${i} of ${n}.`,
      dealerTurn: "Dealer's turn…",
      blackjackWin: 'Blackjack! You win big! 🎉',
      youWin: 'You win! 🎉',
      dealerWins: 'Dealer wins this round.',
      pushReturned: 'Push — bet returned.',
      results: (w, l, p) => `Results: ${w} win · ${l} loss · ${p} push.`,
      softPrefix: 'soft ',
      won: 'Win', lost: 'Lost', pushTag: 'Push', bjWin: 'Blackjack!',
      outOfChips: "You're out of chips — the house grants you a fresh <b>$1000</b> stake. Good luck!",
      bankReset: 'Bankroll reset to <b>$1000</b>.',
      hintMsg: (rec, up) => {
        const names = { HIT:'Hit', STAND:'Stand', DOUBLE:'Double Down', SPLIT:'Split' };
        const why = {
          HIT:'your total is low enough that drawing improves your odds',
          STAND:'the dealer is likely to bust or you already hold a strong total',
          DOUBLE:'you have an edge here — maximize the bet on one extra card',
          SPLIT:'splitting turns a weak pair into two stronger starting hands'
        };
        return `Basic strategy says: <b>${names[rec]}</b><br><span style="font-size:.82rem;opacity:.85">vs dealer ${up} — ${why[rec]}.</span>`;
      },
      // modal
      modalTitle: 'How to Play & Strategy',
      m_goalH: 'The Goal',
      m_goalP: 'Beat the dealer: get closer to 21 than they do, without going over. Number cards count at face value, J/Q/K count as 10, and an Ace counts as 1 or 11 — whichever helps you more.',
      m_actionsH: 'Your Moves',
      m_actionsList: [
        '<b>Hit</b> — take another card.',
        '<b>Stand</b> — keep your current total.',
        '<b>Double Down</b> — double your bet and take exactly one more card.',
        '<b>Split</b> — if your two cards match, split them into two separate hands.',
        'A two-card 21 is a <b>Blackjack</b> and pays 3:2. The dealer stands on 17.'
      ],
      m_countH: 'Hi-Lo Card Counting',
      m_countP: 'Each card you see is worth a value: cards <b>2–6 = +1</b>, <b>7–9 = 0</b>, and <b>10 / J / Q / K / A = −1</b>. Add these up as cards appear to get the <b>Running Count</b>. Divide it by the number of decks still in the shoe to get the <b>True Count</b>.',
      m_countP2: 'A high positive true count means many tens and aces remain — that favors you (more blackjacks, and the dealer busts more often). Skilled players raise their bets as the true count climbs.',
      m_stratH: 'The Logic Behind the Hints',
      m_stratP: 'The Basic Strategy hint always picks the move with the highest expected value for your exact total versus the dealer’s upcard — distilled from millions of simulated hands.',
      m_stratList: [

  const Sound = (() => {
    let ctx = null, enabled = true;
    function ac(){ if(!ctx){ try{ ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ enabled=false; } } return ctx; }
    function tone(freq, dur, type='sine', vol=0.2, when=0){
      if(!enabled) return;
      const c = ac(); if(!c) return;
      const t = c.currentTime + when;
      const osc = c.createOscillator(), g = c.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(g).connect(c.destination);
      osc.start(t); osc.stop(t + dur + 0.02);
    }
    return {
      toggle(){ enabled = !enabled; if(enabled) ac(); return enabled; },
      on(){ return enabled; },
      resume(){ const c = ac(); if(c && c.state === 'suspended') c.resume(); },
      deal(){ tone(320, 0.08, 'triangle', 0.18); tone(180,0.06,'square',0.05,0.01); },
      chip(){ tone(880,0.05,'square',0.12); tone(1200,0.05,'square',0.08,0.04); },

  const FX = (() => {
    const canvas = document.getElementById('fx');
    const c = canvas.getContext('2d');

    function resize(){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    resize();
    window.addEventListener('resize', resize);
    const COLORS = ['#e74c3c','#2ecc71','#3498db','#9b59b6','#f1c40f','#ecf0f1','#e67e22'];
    const pick = () => COLORS[(Math.random()*COLORS.length)|0];

    function drawChip(p){
      c.save(); c.translate(p.x, p.y); c.rotate(p.rot);
      c.globalAlpha = Math.max(0, Math.min(1, p.life / 40));
      c.beginPath(); c.arc(0,0,p.r,0,7); c.fillStyle = p.color; c.fill();
      c.lineWidth = 3; c.strokeStyle = 'rgba(255,255,255,.85)';
      c.setLineDash([p.r*0.7, p.r*0.55]); c.stroke(); c.setLineDash([]);

      c.restore(); c.globalAlpha = 1;
    }

    function loop(){
      c.clearRect(0,0,canvas.width,canvas.height);
      for(let i = parts.length - 1; i >= 0; i--){
        const p = parts[i];
        p.vy += p.g; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life--;
        if(p.type === 'chip'){
          drawChip(p);
        } else {
          c.globalAlpha = Math.max(0, p.life / p.max);
          c.fillStyle = p.color;
          c.beginPath(); c.arc(p.x, p.y, p.r, 0, 7); c.fill();
          c.globalAlpha = 1;
        }
        if(p.life <= 0 || p.y > canvas.height + 80) parts.splice(i, 1);
      }
      if(parts.length) raf = requestAnimationFrame(loop);
      else { raf = null; c.clearRect(0,0,canvas.width,canvas.height); }
    }
    function start(){ if(!raf) raf = requestAnimationFrame(loop); }

      for(let i = 0; i < n; i++){

          x: Math.random()*canvas.width,
          y: -30 - Math.random()*canvas.height*0.4,

    }

      const n = 44, base = pick();

    }
    return { chips, fireworks };
  })();

    for(let i=shoe.length-1; i>0; i--){

    clear:$('clearBet'), max:$('maxBet'), soundToggle:$('soundToggle'), resetBank:$('resetBank'),
    langSwitch:$('langSwitch'), howTo:$('howTo'),
    rcVal:$('rcVal'), tcVal:$('tcVal'), decksVal:$('decksVal'), edgeVal:$('edgeVal'),
    modal:$('modal'), modalBody:$('modalBody'), modalClose:$('modalClose')
  };

  // ---------- Persistence (localStorage only; no server) ----------
  function loadBank(){
    const v = Number(localStorage.getItem('br_balance'));
    if(Number.isFinite(v) && v > 0) S.balance = v;
  }
  function saveBank(){ localStorage.setItem('br_balance', String(S.balance)); }

  // ---------- HUD ----------
  function updateHUD(){
    if(!el.rcVal) return;
    const decksLeft = shoe.length / 52;
    const tc = S.runningCount / Math.max(0.25, decksLeft);
    const rc = S.runningCount;

    el.rcVal.textContent = (rc > 0 ? '+' : '') + rc;
    el.tcVal.textContent = (tc > 0 ? '+' : '') + tc.toFixed(1);
    el.decksVal.textContent = decksLeft.toFixed(1);

    const cls = v => v > 0 ? 'pos' : (v < 0 ? 'neg' : 'zero');
    el.rcVal.className = 'val ' + cls(rc);
    el.tcVal.className = 'val ' + cls(tc);

    let key, c;
    if(tc >= 2){ key = 'edgeHigh'; c = 'hi'; }
    else if(tc <= -1){ key = 'edgeLow'; c = 'lo'; }
    else { key = 'edgeNeutral'; c = 'mid'; }
    S.edgeKey = key;
    el.edgeVal.className = 'edge ' + c;
    el.edgeVal.textContent = t(key);
  }

  // ---------- Rendering ----------
  const delay = ms => new Promise(r => setTimeout(r, ms));

  function cardEl(card, faceDown){
    const d = document.createElement('div');
    if(faceDown){ d.className = 'card back'; return d; }
    d.className = 'card' + (card.color === 'red' ? ' red' : '');
    d.innerHTML =
      `<div class="corner tl"><span class="r">${card.rank}</span><span class="s">${card.suit}</span></div>`+
      `<div class="pip">${card.suit}</div>`+
      `<div class="corner br"><span class="r">${card.rank}</span><span class="s">${card.suit}</span></div>`;
    return d;
  }

  function renderDealer(){
    el.dealerCards.innerHTML = '';
    S.dealer.forEach(c => el.dealerCards.appendChild(cardEl(c, false)));
    if(!S.holeRevealed && S.hole){
      el.dealerCards.appendChild(cardEl(S.hole, true));
      el.dealerScore.textContent = handTotal(S.dealer);
    } else if(S.hole){
      el.dealerScore.textContent = handTotal([...S.dealer, S.hole]);
    } else {
      el.dealerScore.textContent = S.dealer.length ? handTotal(S.dealer) : '—';
    }
  }

  function renderPlayers(){
    el.playerHands.innerHTML = '';
    S.hands.forEach((h, i) => {
      const wrap = document.createElement('div');
      wrap.className = 'hand' + (i === S.active && S.phase === 'player' ? ' active' : '');
      const cards = document.createElement('div');
      cards.className = 'cards';
      h.cards.forEach(c => cards.appendChild(cardEl(c, false)));
      const score = document.createElement('div');
      score.className = 'score-badge';
      const tot = handTotal(h.cards);
      score.textContent = (isSoft(h.cards) && tot !== 21 ? t('softPrefix') : '') + tot + (tot > 21 ? ' 💥' : '');
      const bet = document.createElement('div');
      bet.className = 'bet-tag';
      bet.textContent = '$' + h.bet + (h.doubled ? ' (x2)' : '');
      const res = document.createElement('div');
      res.className = 'result-tag ' + (h.result || '');
      res.textContent = h.resultKey ? t(h.resultKey) : '';
      wrap.append(cards, score, bet, res);
      el.playerHands.appendChild(wrap);
    });
  }

  function syncWallet(){
    el.balance.textContent = S.balance;
    el.betAmount.textContent = S.bet;
    el.betDisplay.textContent = S.bet;
  }
  function flashBalance(){ el.balance.classList.remove('flash'); void el.balance.offsetWidth; el.balance.classList.add('flash'); }

  function setMessage(key, ...args){ S.msg = { key, args }; renderMessage(); }
  function renderMessage(){ if(S.msg) el.message.textContent = t(S.msg.key, ...S.msg.args); }

  let toastTimer, toastRender = null;
  function showToast(renderFn){
    toastRender = renderFn;
    el.toast.innerHTML = renderFn();
    el.toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.toast.classList.remove('show'), 3200);
  }

  function showPhaseControls(){
    el.betting.classList.toggle('hidden', S.phase !== 'betting');
    el.play.classList.toggle('hidden', S.phase !== 'player');
    el.over.classList.toggle('hidden', S.phase !== 'over');
    if(S.phase === 'player') updateActionButtons();
    updateChipButtons();
  }

  function updateChipButtons(){
    document.querySelectorAll('.chip').forEach(ch => {
      ch.toggleAttribute('disabled', S.phase !== 'betting' || Number(ch.dataset.val) > S.balance);
    });
    el.deal.toggleAttribute('disabled', S.bet <= 0);
  }

  function updateActionButtons(){
    const h = S.hands[S.active];
    if(!h) return;
    const twoCards = h.cards.length === 2;
    const canAfford = S.balance >= h.bet;
    el.double.toggleAttribute('disabled', !(twoCards && canAfford));
    const pairVal = twoCards && cardValue(h.cards[0].rank) === cardValue(h.cards[1].rank);
    el.split.toggleAttribute('disabled', !(pairVal && canAfford && S.hands.length < 4));
  }

  // ---------- Betting ----------
  function addBet(v){
    if(S.phase !== 'betting') return;
    if(v > S.balance) return;
    S.bet += v;
    Sound.chip();
    syncWallet(); updateChipButtons();
  }

  // ---------- Deal / round ----------
  async function startRound(){
    if(S.bet <= 0 || S.bet > S.balance) return;
    Sound.resume();
    S.busy = true;
    S.balance -= S.bet;
    S.phase = 'player';
    S.dealer = []; S.hole = null; S.holeRevealed = false;
    S.hands = [{ cards:[], bet:S.bet, done:false, busted:false, doubled:false, isSplit:false, blackjack:false, result:'', resultKey:'' }];
    S.active = 0;
    syncWallet(); showPhaseControls();
    renderDealer(); renderPlayers();
    setMessage('dealing');
    [el.hit,el.stand,el.double,el.split,el.hint].forEach(b=>b.setAttribute('disabled','true'));

    const p = S.hands[0];
    let card;
    card = draw(); p.cards.push(card); countCard(card); Sound.deal(); renderPlayers(); await delay(320);
    card = draw(); S.dealer.push(card); countCard(card); Sound.deal(); renderDealer(); await delay(320);
    card = draw(); p.cards.push(card); countCard(card); Sound.deal(); renderPlayers(); await delay(320);
    S.hole = draw(); Sound.deal(); renderDealer(); await delay(300);   // hole stays hidden, counted on reveal

    const playerBJ = handTotal(p.cards) === 21;
    const dealerBJ = handTotal([...S.dealer, S.hole]) === 21;

    if(playerBJ || dealerBJ){
      p.blackjack = playerBJ && !dealerBJ;
      await revealHole();
      S.busy = false;
      finishRound();
      return;
    }

    S.busy = false;
    [el.hit,el.stand,el.hint].forEach(b=>b.removeAttribute('disabled'));
    updateActionButtons();
    setMessage('yourMove');
  }

  async function playerHit(){
    if(S.busy || S.phase !== 'player') return;
    const h = S.hands[S.active];
    S.busy = true;
    const nc = draw(); h.cards.push(nc); countCard(nc); Sound.deal(); renderPlayers();
    await delay(250);
    const tot = handTotal(h.cards);
    if(tot > 21){
      h.busted = true; h.done = true; Sound.bust();
      setMessage('bustOn', tot);
      await delay(500);
      await nextHandOrDealer();
    } else {
      updateActionButtons();
      el.double.setAttribute('disabled','true');
      el.split.setAttribute('disabled','true');
      setMessage('youHave', tot);
    }
    S.busy = false;
  }

  async function playerStand(){
    if(S.busy || S.phase !== 'player') return;
    S.hands[S.active].done = true;
    await nextHandOrDealer();
  }

  async function playerDouble(){
    if(S.busy || S.phase !== 'player') return;
    const h = S.hands[S.active];
    if(h.cards.length !== 2 || S.balance < h.bet) return;
    S.busy = true;
    S.balance -= h.bet; h.bet *= 2; h.doubled = true;
    Sound.chip(); syncWallet();
    const nc = draw(); h.cards.push(nc); countCard(nc); Sound.deal(); renderPlayers();
    await delay(300);
    const tot = handTotal(h.cards);
    if(tot > 21){ h.busted = true; Sound.bust(); setMessage('doubledBust', tot); }
    else setMessage('doubledStand', tot);
    h.done = true;
    await delay(500);
    await nextHandOrDealer();
    S.busy = false;
  }

  async function playerSplit(){
    if(S.busy || S.phase !== 'player') return;
    const h = S.hands[S.active];
    const canSplit = h.cards.length === 2 &&
      cardValue(h.cards[0].rank) === cardValue(h.cards[1].rank) &&
      S.balance >= h.bet && S.hands.length < 4;
    if(!canSplit) return;
    S.busy = true;
    S.balance -= h.bet; syncWallet(); Sound.chip();

    const moved = h.cards.pop();   // already counted when first dealt
    const newHand = { cards:[moved], bet:h.bet, done:false, busted:false, doubled:false, isSplit:true, blackjack:false, result:'', resultKey:'' };
    h.isSplit = true;
    S.hands.splice(S.active + 1, 0, newHand);

    const splittingAces = moved.rank === 'A';

    let c1 = draw(); h.cards.push(c1); countCard(c1); Sound.deal(); renderPlayers(); await delay(280);
    let c2 = draw(); newHand.cards.push(c2); countCard(c2); Sound.deal(); renderPlayers(); await delay(280);

    if(splittingAces){
      h.done = true; newHand.done = true;
      setMessage('splitAces');
      await delay(500);
      await nextHandOrDealer();
    } else {
      updateActionButtons();
      setMessage('playingHand', S.active + 1);
    }
    S.busy = false;
  }

  async function nextHandOrDealer(){
    const idx = S.hands.findIndex(h => !h.done);
    if(idx !== -1){
      S.active = idx;
      renderPlayers();
      el.double.removeAttribute('disabled');
      updateActionButtons();
      setMessage('playingHandOf', S.active + 1, S.hands.length);
      return;
    }
    await dealerPlay();
  }

  async function revealHole(){
    if(S.holeRevealed) return;
    S.holeRevealed = true;
    const hc = S.hole;
    countCard(hc);           // hole card becomes visible → now counted
    S.dealer.push(hc);
    S.hole = null;
    Sound.flip();
    renderDealer();
    await delay(400);
  }

  async function dealerPlay(){
    S.phase = 'dealer';
    showPhaseControls();
    renderPlayers();
    await revealHole();

    const anyAlive = S.hands.some(h => !h.busted);
    if(anyAlive){
      setMessage('dealerTurn');
      while(handTotal(S.dealer) < 17){
        await delay(550);
        const dc = draw(); S.dealer.push(dc); countCard(dc); Sound.deal(); renderDealer();
      }
      await delay(400);
      if(handTotal(S.dealer) > 21) Sound.bust();
    }
    finishRound();
  }

  function finishRound(){
    const dt = handTotal(S.holeRevealed ? S.dealer : [...S.dealer, S.hole]);
    const dealerBJ = dt === 21 && (S.holeRevealed ? S.dealer.length === 2 : (S.dealer.length + 1) === 2);
    let wins = 0, loses = 0, pushes = 0;

    for(const h of S.hands){
      const pt = handTotal(h.cards);
      if(h.busted){
        h.result = 'lose'; h.resultKey = 'lost'; loses++;
      } else if(h.blackjack){
        if(dealerBJ){ h.result='push'; h.resultKey='pushTag'; S.balance += h.bet; pushes++; }
        else { h.result='win'; h.resultKey='bjWin'; S.balance += h.bet + Math.floor(h.bet*1.5); wins++; }
      } else if(dt > 21){
        h.result='win'; h.resultKey='won'; S.balance += h.bet*2; wins++;
      } else if(pt > dt){
        h.result='win'; h.resultKey='won'; S.balance += h.bet*2; wins++;
      } else if(pt === dt){
        h.result='push'; h.resultKey='pushTag'; S.balance += h.bet; pushes++;
      } else {
        h.result='lose'; h.resultKey='lost'; loses++;
      }
    }

    S.holeRevealed = true;
    S.phase = 'over';
    syncWallet(); flashBalance(); saveBank();
    renderDealer(); renderPlayers(); showPhaseControls();

    const anyBJ = S.hands.some(h => h.blackjack && h.result === 'win');
    if(wins > 0 && loses === 0){
      setMessage(anyBJ ? 'blackjackWin' : 'youWin');
      anyBJ ? Sound.blackjack() : Sound.win();
    } else if(wins === 0 && loses > 0 && pushes === 0){
      setMessage('dealerWins');
      Sound.lose();
    } else if(wins === 0 && loses === 0){
      setMessage('pushReturned');
      Sound.push();
    } else {
      setMessage('results', wins, loses, pushes);
      wins >= loses ? Sound.win() : Sound.lose();
    }

    // Celebration effects
    if(anyBJ){ FX.fireworks(); FX.chips(48); }
    else if(wins > 0){ FX.chips(wins > loses ? 34 : 22); }
  }

  function newHand(){
    S.phase = 'betting';
    S.bet = 0;
    S.dealer = []; S.hole = null; S.holeRevealed = false;
    S.hands = []; S.active = 0;
    syncWallet();
    el.dealerCards.innerHTML = ''; el.dealerScore.textContent = '—';
    el.playerHands.innerHTML = '';
    showPhaseControls();
    setMessage('placeBet');
  }

  // ---------- Basic Strategy Hint ----------
  function basicStrategy(cards, dealerUpRank, canDouble, canSplit){
    const up = cardValue(dealerUpRank);
    const total = handTotal(cards);
    const soft = isSoft(cards);
    const isPair = cards.length === 2 && cardValue(cards[0].rank) === cardValue(cards[1].rank);
    const pairVal = isPair ? cardValue(cards[0].rank) : 0;

    if(isPair && canSplit){
      if(pairVal === 11) return 'SPLIT';
      if(pairVal === 10) return 'STAND';
      if(pairVal === 9)  return (up===7||up===10||up===11) ? 'STAND' : 'SPLIT';
      if(pairVal === 8)  return 'SPLIT';
      if(pairVal === 7)  return (up>=2&&up<=7) ? 'SPLIT' : 'HIT';
      if(pairVal === 6)  return (up>=2&&up<=6) ? 'SPLIT' : 'HIT';
      if(pairVal === 5)  return (up>=2&&up<=9 && canDouble) ? 'DOUBLE' : 'HIT';
      if(pairVal === 4)  return (up===5||up===6) ? 'SPLIT' : 'HIT';
      if(pairVal === 3)  return (up>=2&&up<=7) ? 'SPLIT' : 'HIT';
      if(pairVal === 2)  return (up>=2&&up<=7) ? 'SPLIT' : 'HIT';
    }

    if(soft){
      if(total >= 19) return 'STAND';
      if(total === 18){
        if(up>=3 && up<=6) return canDouble ? 'DOUBLE' : 'STAND';
        if(up===2 || up===7 || up===8) return 'STAND';
        return 'HIT';
      }
      if(total === 17) return (up>=3&&up<=6 && canDouble) ? 'DOUBLE' : 'HIT';
      if(total === 16 || total === 15) return (up>=4&&up<=6 && canDouble) ? 'DOUBLE' : 'HIT';
      if(total === 14 || total === 13) return (up>=5&&up<=6 && canDouble) ? 'DOUBLE' : 'HIT';
      return 'HIT';
    }

    if(total >= 17) return 'STAND';
    if(total >= 13 && total <= 16) return (up>=2&&up<=6) ? 'STAND' : 'HIT';
    if(total === 12) return (up>=4&&up<=6) ? 'STAND' : 'HIT';
    if(total === 11) return canDouble ? 'DOUBLE' : 'HIT';
    if(total === 10) return (up>=2&&up<=9 && canDouble) ? 'DOUBLE' : 'HIT';
    if(total === 9)  return (up>=3&&up<=6 && canDouble) ? 'DOUBLE' : 'HIT';
    return 'HIT';
  }

  function showHint(){
    if(S.phase !== 'player') return;
    Sound.chip();
    const h = S.hands[S.active];
    const up = S.dealer[0];
    const canDouble = h.cards.length === 2 && S.balance >= h.bet;
    const canSplit = h.cards.length === 2 &&
      cardValue(h.cards[0].rank) === cardValue(h.cards[1].rank) &&
      S.balance >= h.bet && S.hands.length < 4;
    const rec = basicStrategy(h.cards, up.rank, canDouble, canSplit);
    showToast(() => t('hintMsg', rec, up.rank));
  }

  // ---------- Instructions modal ----------
  function buildModal(){
    return `
      <h2>${t('modalTitle')}</h2>
      <h3>${t('m_goalH')}</h3><p>${t('m_goalP')}</p>
      <h3>${t('m_actionsH')}</h3><ul>${t('m_actionsList').map(x => `<li>${x}</li>`).join('')}</ul>
      <h3>${t('m_countH')}</h3><p>${t('m_countP')}</p><p>${t('m_countP2')}</p>
      <h3>${t('m_stratH')}</h3><p>${t('m_stratP')}</p><ul>${t('m_stratList').map(x => `<li>${x}</li>`).join('')}</ul>
      <p style="opacity:.6;font-size:.8rem;margin-top:14px">${t('m_disclaimer')}</p>
    `;
  }
  function openModal(){
    el.modalBody.innerHTML = buildModal();
    el.modalBody.dir = RTL[lang] ? 'rtl' : 'ltr';
    el.modal.classList.remove('hidden');
    requestAnimationFrame(() => el.modal.classList.add('show'));
    Sound.resume(); Sound.chip();
  }
  function closeModal(){
    el.modal.classList.remove('show');
    setTimeout(() => el.modal.classList.add('hidden'), 250);
  }

  // ---------- Language switching ----------
  function applyLanguage(){
    document.querySelectorAll('[data-i18n]').forEach(e => { e.textContent = t(e.dataset.i18n); });
    el.soundToggle.textContent = t(Sound.on() ? 'soundOn' : 'soundOff');
    el.langSwitch.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
    document.documentElement.lang = lang;
    const dir = RTL[lang] ? 'rtl' : 'ltr';
    el.message.dir = dir;
    el.toast.dir = dir;
    renderMessage();
    updateHUD();
    if(S.hands.length) renderPlayers();
    if(el.toast.classList.contains('show') && toastRender) el.toast.innerHTML = toastRender();
    if(!el.modal.classList.contains('hidden')){
      el.modalBody.innerHTML = buildModal();
      el.modalBody.dir = dir;
    }
  }

  function setLanguage(next){
    if(next === lang || !LANGS.includes(next)) return;
    Sound.resume(); Sound.chip();
    document.body.classList.add('lang-fade');
    setTimeout(() => {
      lang = next;
      localStorage.setItem('br_lang', lang);
      applyLanguage();
      document.body.classList.remove('lang-fade');
    }, 200);
  }

  // ---------- Events ----------
  document.querySelectorAll('.chip').forEach(ch =>
    ch.addEventListener('click', () => addBet(Number(ch.dataset.val))));
  el.clear.addEventListener('click', () => { if(S.phase==='betting'){ S.bet=0; syncWallet(); updateChipButtons(); }});
  el.max.addEventListener('click', () => { if(S.phase==='betting'){ S.bet=S.balance; Sound.chip(); syncWallet(); updateChipButtons(); }});
  el.deal.addEventListener('click', startRound);
  el.hit.addEventListener('click', playerHit);
  el.stand.addEventListener('click', playerStand);
  el.double.addEventListener('click', playerDouble);
  el.split.addEventListener('click', playerSplit);
  el.hint.addEventListener('click', showHint);
  el.next.addEventListener('click', newHand);

  el.langSwitch.querySelectorAll('button').forEach(b =>
    b.addEventListener('click', () => setLanguage(b.dataset.lang)));

  el.howTo.addEventListener('click', openModal);
  el.modalClose.addEventListener('click', closeModal);
  el.modal.addEventListener('click', (e) => { if(e.target === el.modal) closeModal(); });

  el.soundToggle.addEventListener('click', () => {
    const on = Sound.toggle();
    el.soundToggle.textContent = t(on ? 'soundOn' : 'soundOff');
    if(on) Sound.chip();
  });
  el.resetBank.addEventListener('click', () => {
    if(S.phase === 'betting'){ S.balance = 1000; S.bet = 0; saveBank(); syncWallet(); updateChipButtons(); showToast(() => t('bankReset')); }
  });

  document.addEventListener('keydown', (e) => {
    if(e.key === 'Escape' && !el.modal.classList.contains('hidden')){ closeModal(); return; }
    if(S.phase === 'player'){
      if(e.key === 'h') playerHit();
      else if(e.key === 's') playerStand();
      else if(e.key === 'd') playerDouble();
      else if(e.key === 'p') playerSplit();
      else if(e.key === '?') showHint();
    } else if(S.phase === 'betting' && e.key === 'Enter'){ startRound(); }
    else if(S.phase === 'over' && e.key === 'Enter'){ newHand(); }
  });

  // ---------- Init ----------
  loadBank();
  buildShoe();
  syncWallet();
  S.msg = { key: 'placeBet', args: [] };
  showPhaseControls();
  applyLanguage();
})();
</script>
</body>
</html>
